version: 2

sources:
  - name: ecomm
    database: raw
    tables:
      - name: deliveries
      
      - name: customers
        description: Each record in this table represents a customer in our ecommerce application
        columns:
          - name: id
            description: "{{ doc('customer_id') }}"

      - name: orders
        identifier: orders_us
        description: Each record in this table represents an order in our ecommerce application

      - name: order_lines
        description: Each record in this table represents one product line item within an order
      
      - name: products
        description: Each record in this table represents a product in our ecommerce application.
        columns:
          - name: id
            description: Unique identifier for each product in the products table.
          - name: name
            description: The name of the product.
          - name: price
            description: The price of the product.
          - name: created_at
            description: The timestamp when the product was created.
          - name: updated_at
            description: The timestamp when the product was last updated.
      
  - name: sheets
    database: raw
    tables:
      - name: customer_survey_responses
version: 2

sources:
  - name: ecomm
    database: raw
    tables:
      - name: deliveries
      
      - name: customers
        description: Each record in this table represents a customer in our ecommerce application
        columns:
          - name: id
            description: "{{ doc('customer_id') }}"

      - name: orders
        identifier: orders_us
        description: Each record in this table represents an order in our ecommerce application

      - name: order_lines
        description: Each record in this table represents one product line item within an order
      
      - name: products
        description: Each record in this table represents a product in our ecommerce application.
        columns:
          - name: id
            description: Unique identifier for each product in the products table.
          - name: category
            description: The category to which the product belongs.
          - name: subcategory
            description: The subcategory to which the product belongs.
          - name: created_at
            description: The timestamp when the product was created.
          - name: name
            description: The name of the product.
          - name: is_active
            description: A boolean indicating whether the product is currently active and available for purchase.
          - name: unit_price
            description: The price per unit of the product.
          - name: variants
            description: A JSON array containing the different variants of the product, such as size or color.
          - name: _synced_at
            description: The timestamp when the product record was last synchronized with the source system.

  - name: sheets
    database: raw
    tables:
      - name: customer_survey_responses
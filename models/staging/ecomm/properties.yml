version: 2

models:
  - name: stg_ecomm__order_lines
    description: One record per order line item, representing a single product within an order.
    columns:
      - name: order_line_id
        description: Primary key for order lines, renamed from id.
        tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to the orders table.
      - name: line_number
        description: Position of this line item within the order.
      - name: product_id
        description: Foreign key to the products table.
      - name: quantity
        description: Number of units of the product ordered on this line.
      - name: unit_price
        description: Price per unit of the product at the time of the order.
      - name: discount_pct
        description: Discount percentage applied to this line item.
      - name: line_total
        description: Total price for this line after applying quantity and discount.
      - name: synced_at
        description: Timestamp when this record was last synced from the source system.

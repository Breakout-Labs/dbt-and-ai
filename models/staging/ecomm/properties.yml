version: 2

models:
  - name: stg_ecomm__order_lines
    description: One record per order line item, representing a single product within an order.
    columns:
      - name: order_line_id
        description: Primary key for order lines, renamed from id.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to the orders table.
      - name: line_number
        description: Position of this line item within the order.
      - name: product_id
        description: Foreign key to the products table.
      - name: quantity
        description: Number of units of the product ordered on this line.
      - name: unit_price
        description: Price per unit of the product at the time of the order.
      - name: discount_pct
        description: Discount percentage applied to this line item.
      - name: line_total
        description: Total price for this line after applying quantity and discount.
      - name: synced_at
        description: Timestamp when this record was last synced from the source system.

  - name: stg_stripe__payments
    description: One record per Stripe payment, flattened from the raw JSON_DATA object.
    columns:
      - name: payment_id
        description: Primary key for payments, flattened from the Stripe payment id field.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to the related order in the ecommerce application.
      - name: amount_cents
        description: Payment amount in cents from the raw Stripe payload.
      - name: payment_method
        description: Payment method used for the transaction.
      - name: payment_provider
        description: Payment provider that processed the transaction.
      - name: created_at
        description: Timestamp when the payment record was created in Stripe.

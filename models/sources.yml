version: 2

sources:
  - name: ecomm
    database: raw
    tables:
      - name: deliveries
      
      - name: customers
        description: Each record in this table represents a customer in our ecommerce application
        columns:
          - name: id
            description: "{{ doc('customer_id') }}"

      - name: orders
        identifier: orders_us
        description: Each record in this table represents an order in our ecommerce application.

      - name: order_lines
        description: Each record in this table represents one product line item within an order

      - name: products
        description: Product catalog with categories, pricing, and variant metadata
      
      
  - name: sheets
    database: raw
    tables:
      - name: customer_survey_responses

  - name: stripe
    database: raw
    tables:
      - name: payments
        description: Raw Stripe payment events - one JSON object per payment in the JSON_DATA column.

  - name: movies
    database: raw
    tables:
      - name: ratings
        description: Movie ratings with one record per user and movie rating event.
      - name: movies
        description: Movie catalog with title and genres metadata.

version: 2

models:
  - name: customers
    description: Each record represents a customer.
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: A customer's first name.
      - name: last_name
        description: A customer's last name.
      - name: count_orders
        description: The number of orders a customer has had all-time.
      - name: first_order_at
        description: The timestamp of a customer's first order.
      - name: most_recent_order_at
        description: The timestamp of a customer's most recent order.

  - name: orders
    description: Each record represents an order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: finance__monthly_revenue
    description: >
      Monthly aggregation of order revenue for the finance team to track sales trends.
      One row per calendar month. Only delivered orders are counted as revenue.
    columns:
      - name: revenue_month
        description: First day of the calendar month (date truncated from ordered_at).
        data_tests:
          - unique
          - not_null
      - name: order_count
        description: Number of delivered orders in the month.
      - name: total_revenue
        description: Sum of total_amount across all delivered orders in the month.
        data_tests:
          - not_null

  - name: movie_rating_summary
    description: One row per movie with aggregated rating activity and movie metadata.
    columns:
      - name: movie_id
        description: Unique identifier for the movie.
        data_tests:
          - unique
          - not_null
      - name: title
        description: Title of the movie from the raw movies source table.
      - name: genres
        description: Pipe-delimited genre list for the movie.
      - name: rating_count
        description: Total number of ratings submitted for the movie.
        data_tests:
          - not_null
      - name: average_rating
        description: Average rating value across all ratings for the movie.
        data_tests:
          - not_null
      - name: distinct_user_count
        description: Number of distinct users who rated the movie.
        data_tests:
          - not_null


  - name: movie_co_occurrence
    description: One row per unique pair of movies with the number of distinct users who rated both movies.
    columns:
      - name: movie_id_1
        description: The lower-valued movie identifier in the pair.
        data_tests:
          - not_null
      - name: movie_title_1
        description: Title of the first movie in the pair.
      - name: movie_id_2
        description: The higher-valued movie identifier in the pair.
        data_tests:
          - not_null
      - name: movie_title_2
        description: Title of the second movie in the pair.
      - name: distinct_user_count
        description: Number of distinct users who rated both movies in the pair.
        data_tests:
          - not_null

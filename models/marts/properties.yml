version: 2

models:
  - name: customers
    description: Each record represents a customer.
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        tests:
          - unique
          - not_null
      - name: first_name
        description: A customer's first name.
      - name: last_name
        description: A customer's last name.
      - name: count_orders
        description: The number of orders a customer has had all-time.
      - name: first_order_at
        description: The timestamp of a customer's first order.
      - name: most_recent_order_at
        description: The timestamp of a customer's most recent order.
        
  - name: orders
    description: Each record represents an order.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: finance__monthly_revenue
    description: >
      Monthly aggregation of order revenue for the finance team to track sales trends.
      One row per calendar month. Only delivered orders are counted as revenue.
    columns:
      - name: revenue_month
        description: First day of the calendar month (date truncated from ordered_at).
        tests:
          - unique
          - not_null
      - name: order_count
        description: Number of delivered orders in the month.
      - name: total_revenue
        description: Sum of total_amount across all delivered orders in the month.
        tests:
          - not_null
version: 2

models:
  - name: customers
    description: Each record represents a customer.
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        tests:
          - unique
          - not_null
      - name: first_name
        description: A customer's first name.
      - name: last_name
        description: A customer's last name.
      - name: count_orders
        description: The number of orders a customer has had all-time.
      - name: first_order_at
        description: The timestamp of a customer's first order.
      - name: most_recent_order_at
        description: The timestamp of a customer's most recent order.
        
  - name: orders
    description: Each record represents an order.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: deliveries
    description: Aggregates key delivery metrics at the customer level, including total, successful, failed, and other delivery counts, as well as the date of the customer's last delivery.
    columns:
      - name: customer_id
        description: A unique customer ID from our ecommerce application.
        tests:
          - unique
          - not_null

      - name: total_deliveries
        description: Total number of deliveries across all statuses associated with the customer.
        tests:
          - not_null

      - name: successful_deliveries
        description: Number of deliveries with a status of 'delivered' for the customer.
        tests:
          - not_null

      - name: failed_deliveries
        description: Number of deliveries with a status of 'failed' for the customer.
        tests:
          - not_null

      - name: other_status_deliveries
        description: Number of deliveries with a status other than 'delivered' or 'failed' for the customer.
        tests:
          - not_null

      - name: fulfillment_ratio
        description: Percentage of fulfilled deliveries per customer.
        tests:
          - not_null

      - name: last_delivery_date
        description: The date of the customer's most recent delivery, based on the delivered_at timestamp. Will be null if the customer has no deliveries with a populated delivered_at value.
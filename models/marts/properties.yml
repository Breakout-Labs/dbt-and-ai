version: 2

models:
  - name: customers
    description: Each record represents a customer.
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        tests:
          - unique
          - not_null
      - name: first_name
        description: A customer's first name.
      - name: last_name
        description: A customer's last name.
      - name: count_orders
        description: The number of orders a customer has had all-time.
      - name: first_order_at
        description: The timestamp of a customer's first order.
      - name: most_recent_order_at
        description: The timestamp of a customer's most recent order.
        
  - name: orders
    description: Each record represents an order.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: deliveries
    description: Each record represents a customer's aggregated delivery history, including counts by delivery status and the date of their most recent delivery.
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        tests:
          - unique
          - not_null
      - name: total_deliveries
        description: The total number of deliveries associated with the customer across all orders.
        tests:
          - not_null
      - name: successful_deliveries
        description: The number of deliveries with a status of 'delivered'.
        tests:
          - not_null
      - name: cancelled_deliveries
        description: The number of deliveries with a status of 'failed'.
        tests:
          - not_null
      - name: other_status_deliveries
        description: The number of deliveries with a status other than 'delivered' or 'failed'.
        tests:
          - not_null
      - name: last_delivery_date
        description: The date of the customer's most recent delivered shipment.

version: 2

models:
  - name: deliveries
    description: Each record represents a customer's aggregated delivery history, including counts of deliveries by status and the date of their most recent delivery.
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        tests:
          - unique
          - not_null
      - name: total_deliveries
        description: Total number of deliveries across all statuses for the customer.
        tests:
          - not_null
      - name: successful_deliveries
        description: Number of deliveries with a status of 'delivered' for the customer.
        tests:
          - not_null
      - name: failed_deliveries
        description: Number of deliveries with a status of 'cancelled' for the customer.
        tests:
          - not_null
      - name: other_status_deliveries
        description: Number of deliveries with a status other than 'delivered' or 'failed' for the customer.
        tests:
          - not_null
      - name: last_delivery_date
        description: The date of the customer's most recent successful delivery, based on the delivered_at timestamp.
      - name: fulfillment_ratio
        description: The percentage of deliveries with a status of 'delivered' out of all deliveries for the customer, expressed as a value between 0 and 100 rounded to 2 decimal places. Returns 0 if the customer has no deliveries.
        tests:
          - not_null